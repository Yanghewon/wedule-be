name: CI

# main 브랜치에 push되거나, main으로 향하는 PR이 생성될 때 이 워크플로우를 실행
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소의 코드를 워크플로우 실행 환경으로 가져옴
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. 프로젝트에 맞는 자바 버전(21) 설치
      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Gradle 실행 권한 부여 (Linux 환경이라 필요함)
      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      # 4. 빌드 + 테스트 실행
      #    OPENAI_API_KEY를 일부러 등록 안 해서, AI 통합 테스트는 자동으로 스킵됨
      - name: 빌드 및 테스트
        run: ./gradlew clean build