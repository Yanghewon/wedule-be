spring.application.name=wedule

# DB \uC5F0\uACB0 \uC8FC\uC18C (localhost:\uD3EC\uD2B8/DB\uC774\uB984)
spring.datasource.url=jdbc:mysql://localhost:3306/wedule

# DB \uC811\uC18D \uACC4\uC815
spring.datasource.username=root

# DB \uC811\uC18D \uBE44\uBC00\uBC88\uD638 (\uD658\uACBD\uBCC0\uC218\uC5D0\uC11C \uC77D\uC5B4\uC634)
spring.datasource.password=${DB_PASSWORD}

# \uC5D4\uD2F0\uD2F0 \uBCC0\uACBD\uC0AC\uD56D\uC744 \uD14C\uC774\uBE14\uC5D0 \uC790\uB3D9 \uBC18\uC601
spring.jpa.hibernate.ddl-auto=update

# JWT \uC11C\uBA85\uC5D0 \uC0AC\uC6A9\uD560 \uBE44\uBC00 \uD0A4 (\uCD5C\uC18C 32\uC790 \uC774\uC0C1 \uAD8C\uC7A5, \uC2E4\uC81C \uC11C\uBE44\uC2A4\uC5D0\uC120 \uD6E8\uC52C \uBCF5\uC7A1\uD558\uAC8C)
jwt.secret=${JWT_SECRET:wedule-temporary-secret-key-change-this-later-12345678}

# OpenAI API \uD0A4 (\uD658\uACBD\uBCC0\uC218\uC5D0\uC11C \uC77D\uC5B4\uC634)
openai.api-key=${OPENAI_API_KEY}

openai.model=gpt-4.1-mini